{% extends "base.html" %}
{% block title %}{{ t.invite_title }} — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>{{ t.invite_title }}</h1>
  <p class="sub">{{ t.invite_for }} <strong>{{ tok.email }}</strong>.</p>

  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

  <div class="card">
    <form method="post" action="/invite/{{ raw }}">
      <label for="name">{{ t.invite_name }}</label>
      <input id="name" name="name" type="text" value="{{ data.name or '' }}" autofocus>
      <label for="password">{{ t.invite_pw }}</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required>
      <label for="password2">{{ t.invite_pw2 }}</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
      <div class="actions">
        <button class="btn-primary" type="submit">{{ t.invite_activate }}</button>
      </div>
    </form>
  </div>

  {% if orcid_ready %}
    <p class="note">{{ t.invite_orcid_note }}</p>
  {% endif %}
</div>
{% endblock %}
