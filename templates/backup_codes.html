{% extends "base.html" %}
{% block title %}{{ t.codes_title }} — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>{{ t.codes_title }}</h1>
  <p class="sub">{{ t.codes_sub | safe }}</p>

  <div class="card">
    <div class="codes">
      {% for c in codes %}<span>{{ c }}</span>{% endfor %}
    </div>
  </div>

  <p class="note">{{ t.codes_invalidated }}</p>
  <a class="btn" href="{{ cont | default('/profile', true) }}">{{ t.codes_done }}</a>
</div>
{% endblock %}
