{% extends "base.html" %}
{% block title %}{{ t.logout_title }} — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>{{ t.logout_title }}</h1>
  <p class="sub">{{ t.logout_sub }}</p>

  <div class="card">
    <form method="post" action="/logout" class="inline">
      <button class="btn-primary" type="submit">{{ t.logout_confirm }}</button>
      <a class="btn" href="/">{{ t.logout_cancel }}</a>
    </form>
  </div>
</div>
{% endblock %}
