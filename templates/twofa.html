{% extends "base.html" %}
{% block title %}{{ t.twofa_title }} — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>{{ t.twofa_title }}</h1>
  <p class="sub">{{ t.twofa_sub }}</p>

  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

  <div class="card">
    <form method="post" action="/2fa">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="rd" value="{{ rd }}">
      <label for="code">{{ t.twofa_code }}</label>
      <input id="code" name="code" class="mono" inputmode="numeric"
             autocomplete="one-time-code" autofocus required>
      <div class="actions">
        <button class="btn-primary" type="submit">{{ t.twofa_verify }}</button>
      </div>
      <p class="note" style="margin-bottom:0">{{ t.twofa_backup_note | safe }}</p>
    </form>
  </div>
</div>
{% endblock %}
