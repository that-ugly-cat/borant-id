{% extends "base.html" %}
{% block title %}{{ t.enroll_title }} — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>{{ t.enroll_title }}</h1>
  <p class="sub">{{ t.enroll_sub }}</p>

  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}

  <div class="card">
    {% if qr %}
      <img class="qr" src="{{ qr }}" alt="{{ t.enroll_qr_alt }}">
    {% endif %}
    <label>{{ t.enroll_manual }}</label>
    <p class="mono break">{{ secret }}</p>
    <p class="note">{{ t.enroll_apps }}</p>

    <form method="post" action="/2fa">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <input type="hidden" name="rd" value="{{ rd }}">
      <input type="hidden" name="stash" value="{{ stash }}">
      <label for="code">{{ t.enroll_confirm }}</label>
      <input id="code" name="code" class="mono" inputmode="numeric"
             autocomplete="one-time-code" autofocus required>
      <div class="actions">
        <button class="btn-primary" type="submit">{{ t.enroll_activate }}</button>
      </div>
    </form>
    <p class="note" style="margin-bottom:0">{{ t.enroll_note }}</p>
  </div>
</div>
{% endblock %}
