{% extends "base.html" %}
{% block title %}Nuova password — {{ site_name }}{% endblock %}
{% block body %}
<div class="narrow">
  <h1>Nuova password</h1>
  <p class="sub">Tutte le sessioni aperte verranno chiuse.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <div class="card">
    <form method="post" action="/reset/{{ raw }}">
      <label for="password">Password (almeno 10 caratteri)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required autofocus>
      <label for="password2">Ripeti la password</label>
      <input id="password2" name="password2" type="password" autocomplete="new-password" required>
      <div class="actions"><button type="submit">Salva</button></div>
    </form>
  </div>
</div>
{% endblock %}
